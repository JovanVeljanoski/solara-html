[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[project]
name = "solara-html"
version = "0.1.0"
description = "Single-file HTML components for Solara through ipyreact ES modules."
readme = "README.md"
authors = [
    {name = "Jovan Veljanoski"},
    {name = "Maarten A. Breddels", email = "maartenbreddels@gmail.com"},
]
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "solara-ui>=1.64.0",
    "solara-server>=1.64.0",
    "ipyreact>=0.6.1",
]

[project.optional-dependencies]
dev = ["pytest", "playwright", "typer", "solara-server[starlette,dev]", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["solara_html"]

[tool.hatch.build.targets.wheel.force-include]
"docs/authoring.md" = "solara_html/authoring.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["solara_html"]
ignore_missing_imports = true
