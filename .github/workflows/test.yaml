name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check .
      - run: mypy

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solara: ["", "==1.64.0"] # latest, and the oldest supported release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv pip install --system -e ".[dev]"
          if [ -n "${{ matrix.solara }}" ]; then uv pip install --system "solara-ui${{ matrix.solara }}" "solara-server${{ matrix.solara }}"; fi
      - run: python -c "import solara; print(solara.__version__)"
      - run: pytest

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solara: ["", "==1.64.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv pip install --system -e ".[dev]"
          if [ -n "${{ matrix.solara }}" ]; then uv pip install --system "solara-ui${{ matrix.solara }}" "solara-server${{ matrix.solara }}"; fi
          playwright install --with-deps chromium
      - run: scripts/run_browser_checks.sh
      - name: Server logs
        if: failure()
        run: tail -n 100 server-*.log || true
      # check_docs.py made the pictures of the docs page; the deploy job publishes them.
      - uses: actions/upload-artifact@v4
        if: matrix.solara == ''
        with:
          name: docs-images
          path: docs/img
          if-no-files-found: error

  # Publishes docs/ to GitHub Pages after every check has passed. It installs nothing.
  deploy-docs:
    needs: [lint, unit, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docs-images
          path: docs/img
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
