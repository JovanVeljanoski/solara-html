</template>

</style>

<script type="module">
  export function mount({ root, get, set, subscribe }) {
    const panel = root.querySelector('.beacon');
    const wave = root.querySelector('.wave');
    const callsignInput = root.querySelector('.field input');
    let commitTimer;

    const paint = () => {
      const power = Math.max(0, Math.min(100, Number(get('intensity')) || 0));
      panel.style.setProperty('--hue', String(get('hue')));
      panel.style.setProperty('--power', String(power / 100));
      panel.style.setProperty('--speed', `${18 - power * .11}s`);
    };
    const pulse = () => {
      wave.classList.remove('travel');
      void wave.offsetWidth;
      wave.classList.add('travel');
    };
    const commitCallsign = () => {
      clearTimeout(commitTimer);
      set('callsign', callsignInput.value);
    };
    const scheduleCallsign = () => {
      clearTimeout(commitTimer);
      commitTimer = setTimeout(commitCallsign, 500);
    };
    const onCallsignKeydown = (event) => {
      if (event.key === 'Enter') {
        commitCallsign();
        callsignInput.blur();
      } else if (event.key === 'Escape') {
        clearTimeout(commitTimer);
        callsignInput.value = get('callsign');
        callsignInput.blur();
      }
    };

    paint();
    callsignInput.value = get('callsign');
    callsignInput.addEventListener('input', scheduleCallsign);
    callsignInput.addEventListener('blur', commitCallsign);
    callsignInput.addEventListener('keydown', onCallsignKeydown);
    const stopCallsign = subscribe('callsign', value => { callsignInput.value = value ?? ''; });
    const stopIntensity = subscribe('intensity', paint);
    const stopHue = subscribe('hue', paint);
    const stopPulse = subscribe('transmissions', pulse);
    return () => {
      clearTimeout(commitTimer);
      callsignInput.removeEventListener('input', scheduleCallsign);
      callsignInput.removeEventListener('blur', commitCallsign);
      callsignInput.removeEventListener('keydown', onCallsignKeydown);
      stopCallsign();
      stopIntensity();
      stopHue();
      stopPulse();
    };
  }
</script>
