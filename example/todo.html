<!--
  A list of dicts as a prop. The browser may change it in place (push, splice, a checkbox on an item)
  or by assignment. Both reach Python.
-->
<template>
  <div class="todo">
    <h2>{{ remaining }} of {{ items.length }} left</h2>
    <form @submit.prevent="add">
      <input v-model="draft" class="new" placeholder="What needs doing?" />
      <button type="submit" class="btn primary" :disabled="!draft.trim()">Add</button>
    </form>
    <ul>
      <li v-for="(item, index) in items" :key="index" :class="{ done: item.done }">
        <label><input v-model="item.done" type="checkbox" /> {{ item.text }}</label>
        <button type="button" class="remove" :aria-label="'Remove ' + item.text" @click="items.splice(index, 1)">×</button>
      </li>
    </ul>
    <button type="button" class="btn secondary clear" :disabled="remaining === items.length" @click="items = items.filter((i) => !i.done)">Clear finished</button>
  </div>
</template>

<style>
  @import "./buttons.css";
  :host { display: block; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  .todo { max-width: 28rem; margin: 0 auto; padding: 1rem; }
  form { display: flex; gap: 0.5rem; }
  form input { flex: 1; padding: 0.5rem; border: 1px solid #9fb0c4; border-radius: 8px; font: inherit; }
  ul { list-style: none; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0; }
  li.done label { text-decoration: line-through; color: #667085; }
  .remove { border: 0; background: none; cursor: pointer; font-size: 1.2rem; }
</style>

<script type="module">
  export const component = {
    data() {
      return { draft: "" };
    },
    computed: {
      remaining() {
        return this.items.filter((item) => !item.done).length;
      },
    },
    methods: {
      add() {
        // `this.items.push(...)` also reaches Python. An assignment is the clearer form.
        this.items = [...this.items, { text: this.draft.trim(), done: false }];
        this.draft = "";
      },
    },
  };
</script>
